import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    // Error Prone, which hosts the NullAway checker.
    id 'net.ltgt.errorprone' version '5.1.1'
}

// Compile with whatever JDK runs Gradle, but emit Java 17 bytecode/API.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.errorprone {
        disableWarningsInGeneratedCode = true
        // Crashes on string literals in Lombok-generated null checks (Error Prone 2.50.0).
        disable('StringConcatToTextBlock')
        // Treat everything under jsh (subpackages included) as null-marked, so no per-package
        // package-info.java with @NullMarked is needed. Only NullAway knows this, not other tools.
        check('NullAway', CheckSeverity.ERROR)
        option('NullAway:AnnotatedPackages', 'jsh')
    }
}

// Tests share packages with main (so they inherit @NullMarked) and deliberately pass nulls.
tasks.named('compileTestJava') {
    options.errorprone.disable('NullAway')
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

sourceSets {
    main{
        java {
            srcDirs += ['src/main/java', 'src/example/java']
        }
    }
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Use lombok -- who won't?
	compileOnly 'org.projectlombok:lombok:1.18.48'
	annotationProcessor 'org.projectlombok:lombok:1.18.48'

	testCompileOnly 'org.projectlombok:lombok:1.18.48'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    // nullness annotations (JSpecify) and their compile-time checker (NullAway on Error Prone)
    implementation 'org.jspecify:jspecify:1.0.1'
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.1'

    // commons lang stuff
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
}

application {
    // Define the main class for the application.
    mainClass = 'jsh.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
